# Story Engine reference model: its tests and typecheck on every push to main and every pull request
# that touches projects/xf-story-engine/. Nothing is built for release or uploaded.
#
# The reference model is the TypeScript oracle for the kernel specification
# (research/story-engine/spec/kernel.md). Its suite includes the frozen determinism digest, so a
# change that alters any resolved value fails here.
#
# The default suite runs the long fixtures at a smaller scale (under two minutes locally). The spec's own figures
# (a Kabuki week, 100 game days, 20 seeds of 30 days, 10,000 casts and the 2,048-seed sweep/replay hunt) run with S1_FULL=1, in the second job: on a
# manual run and once a week, never on a push or a pull request.
name: Story Engine

on:
  push:
    branches: [main]
    paths:
      - "projects/xf-story-engine/**"
      - ".github/workflows/story-engine.yml"
  pull_request:
    paths:
      - "projects/xf-story-engine/**"
      - ".github/workflows/story-engine.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  reference:
    # the weekly run is for the full-scale fixtures below; the fast suite already ran on every change
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: story-engine-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: projects/xf-story-engine/reference
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run check

  reference-full:
    # the spec's figures: manual runs and the weekly schedule only
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: story-engine-full-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: projects/xf-story-engine/reference
    env:
      S1_FULL: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test at the spec's scale
        run: bun test

      - name: Typecheck
        run: bun run check

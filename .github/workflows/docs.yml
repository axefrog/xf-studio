# Documentation hygiene: relative links and anchors in tracked Markdown must resolve.
name: Docs links

on:
  push:
    branches: [main]
    paths: ["**/*.md", "tools/check_links.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", "tools/check_links.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check relative links and anchors
        run: python3 tools/check_links.py

# Repository hygiene: relative links and anchors in tracked Markdown must resolve, and no tracked
# text file may contain personal paths or e-mail addresses (the repository is public).
name: Docs links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check relative links and anchors
        run: python3 tools/check_links.py
      - name: Self-test the personal-path check against its shared vectors
        run: python3 tools/check_private_paths.py --self-test
      - name: Check for personal paths and e-mail addresses
        run: python3 tools/check_private_paths.py

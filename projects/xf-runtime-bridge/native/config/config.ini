; XF Runtime Bridge configuration (red4ext/plugins/XFRuntimeBridge/config.ini).
; Read once when the game starts. Missing keys keep the safe defaults shown here.

[bridge]
; Opens the local named pipe so XF Studio can talk to the running game.
; Off by default: with false, no pipe and no session file exist.
enabled = false
; Write-class requests (anything that changes the game) are refused unless true.
allow_writes = false
; With allow_writes = true, which kinds of change are allowed (comma-separated; empty = none):
; photo (photo mode only), world (clock and freeze), character (the mirror screen's options),
; inventory (V's clothing: equip, unequip, add a test item; only with the maintainer's approval) and
; save (a new manual save, loading a save), showroom (XF Finish Showroom's test heads and light rigs,
; spawned through Codeware; the test profile only), player (moving and turning V, her view, crouching,
; weapons, menus, glides; the test profile only) and act (irreversible actions for V: devices, dialogue,
; consuming; reserved, no command uses it yet). Without this key: photo, world, character.
allow_write_classes = photo, world, character
; With allow_writes = true and the character class: may the bridge leave the character creator
; (cc.confirm keeps the look, cc.back discards it)? Off here; only the -writes package for the
; dedicated test profile turns it on, for sessions that end by loading the safety save.
allow_creator_leave = false
; With allow_writes = true and the photo class: may the bridge write the keys of the XF live-pose
; carrier clip in memory (pose.live.apply; the live-posing experiment)? Off here; only the -writes
; package for the dedicated test profile turns it on.
allow_live_pose = false
; Bridge 0.8.4: test hooks for the session checks (test.save.delay holds the next manual save in its prepare step so the
; kill switch can land inside it; 0.8.7: the test probes test.events, test.save.identity and test.companion.probe, whose
; scripts and companion only that package carries). Off here; only the -writes package for the dedicated test profile turns them on.
allow_test_hooks = false
; How long a request may wait for the game's main thread, in milliseconds (100-30000).
request_timeout_ms = 2000
; Requests per second before "rate_limited" (1-200); short bursts of twice this are allowed.
max_requests_per_second = 20
; A client that sends nothing for this long is disconnected (5-3600 seconds).
idle_disconnect_seconds = 120

[ui]
; Temporary test features (bridge 0.5.3). The XF status panel drawn in the game's own HUD (ink; needs Codeware), which shows
; the bridge's state and XF Studio's messages while the bridge is on; true shows it from the start (ui.hud moves or hides it).
hud_panel = true
; Bridge 0.8.6: where it draws. photo_menu: the HUD in play and, while photo mode is open, inside photo mode's own menu
; (the XF box shows only if that fails); hud: the HUD only (the XF box in photo mode); notifications or top: research layers.
layer = photo_menu
; The Cyber Engine Tweaks status label and message lines (top-left). false leaves only the ink panel.
cet_label = true
; XF Finish Showroom: each head's preset name on its pedestal.
nameplates = true
; Bridge 0.7: the keys that answer XF Studio's questions in the ink panel, in the order of the answers shown.
; Key names as the game's input system spells them (IK_F6 ...); up to four. The 2.31 defaults leave F6, F7, F8 and F11
; free (F9 is quick load); another mod that binds one of them gets the key press too, so change these if one does.
answer_keys = IK_F6, IK_F7, IK_F8, IK_F11
; Bridge 0.8.3: the bridge's own stop key, read by the plugin itself (it needs neither CET nor a binding, and CET forgets its
; bindings after a launch without the mod). It works in normal play, photo mode, menus and loading screens, only while the
; game's window is in front and CET's overlay is closed. 0.8.4: Ctrl + Shift + End by default (End is free in the game's
; default bindings, and the chord is unlikely to be another mod's hotkey). Change... on the XF Runtime Bridge window's
; Keys line sets this line; by hand: a key, a chord with Ctrl, Shift or Alt, or off. Keys: End, Home, Insert,
; Delete, PageUp, PageDown, Pause, ScrollLock, F1-F12, A-Z, 0-9, Numpad0-9, Numpad*, Numpad/, Numpad-, Numpad+, Numpad.
; The CET hotkey "Stop XF Runtime Bridge" still works too. A change made in the window keeps a copy of this file as it was in
; %LOCALAPPDATA%\XFStudio\runtime-bridge\settings-backups (config.ini.<UTC time>.bak, the newest 3).
kill_key = Ctrl+Shift+End
; Bridge 0.8.5: a soft sound when a new question from XF Studio appears, so a missed prompt is rarer: once per question,
; never for other messages. true plays the game's own new-message sound (ui_messenger_recieved); false switches it off;
; or name another of the game's sound events.
question_sound = true

[overlay]
; Bridge 0.7, test feature: XF's own overlay (Dear ImGui) drawn over the game, with one diagnostic panel and no input.
; Off here; the test packages turn it on. It refuses to draw when the game outputs HDR, and never unhooks: switching it
; off makes it pass everything through.
enabled = false
; dark (default) or light: the XF Studio theme's two palettes. Chosen here, never switched automatically. It covers the XF
; Runtime Bridge window, the XF box and the CET line; the ink panel and the pin mark follow the game's own style.
theme = dark
; The panel's size in percent, on top of the screen height / 1080 (50-300).
scale_percent = 100
; Bridge 0.8: the panel's diagnostic lines (frames, CPU time, the back buffer, frame-generation modules, requests and a
; moving bar that shows skipped frames). Off here; the -diagnostic package turns them on.
diagnostics = false

[log]
; debug | info | warn | error. The baseline logs verbosely; RED4ext rotates and bounds the file.
level = debug

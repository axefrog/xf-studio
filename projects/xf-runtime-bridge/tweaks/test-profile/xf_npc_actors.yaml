# XF Runtime Bridge 0.8: the XF actors npc.spawn brings in (research/runtime/npc-direction-design.md §5.1). The test
# profile's -writes package only.
#
# Each is our own TweakXL clone ($base) of a base-game crowd civilian, so no vanilla record is ever changed (AMM changes
# vanilla records in place, which affects every NPC of that record for the session). What each clone changes:
#   isCrowd: false          a full AI puppet that takes AI commands, not a crowd-lane walker [hypothesis: session 9, N4-N5]
#   entityTemplatePath      the base game's own citizen template, so no clone needs Phantom Liberty (the vanilla crowd
#                           records use the ep1 variant when it is installed)
#   reactionPreset          Civilian_NoReaction: calm, no crime or panic reactions, no greeting barks of its own
#                           [hypothesis: session 9, open question 4]
#   affiliation             Factions.Unaffiliated (no gang or faction ties)
#   priority                Regular, as the game's own _quest crowd variants use, so the population budget keeps it
#   objectActions: []       no Talk prompt when V looks at it (it would block npc.choices as choices_busy)
#   items: []               no umbrellas, phones or cans from the crowd props
#   savable: false          never saved (the spawn is non-persistent anyway)
# The records and fields are from the game's REDmod TweakDB sources (characters/bases/base_records.tweak:42-68,
# characters/npcs/records/crowds/communities.tweak, personalities/base_values.tweak:372, factions/factions.tweak:323,
# characters/spawnable_object_priority.tweak:10) [resource].

XFRuntimeBridge.Npc.actorsVersion: 1

Character.xfs_actor_woman_corpo:
  $base: Character.CorpoWoman
  isCrowd: false
  entityTemplatePath: 'base\characters\entities\citizen\citizen__corporat_wa.ent'
  reactionPreset: ReactionPresets.Civilian_NoReaction
  affiliation: Factions.Unaffiliated
  priority: SpawnableObjectPriority.Regular
  objectActions: []
  items: []
  savable: false


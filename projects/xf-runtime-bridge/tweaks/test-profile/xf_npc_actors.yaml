# Session 9's comparison (N4): the plain NPC base (never a crowd record) with the same civilian template, attitude and
# preset, to tell whether a crowd record's clone behaves differently from a non-crowd one. research_crowd_record spawns the
# vanilla Character.CorpoWoman itself (no record needed here).
Character.xfs_actor_research_npc_base:
  $base: Character.NPC_Base
  entityTemplatePath: 'base\characters\entities\citizen\citizen__corporat_wa.ent'
  baseAttitudeGroup: civilian
  reactionPreset: ReactionPresets.Civilian_NoReaction
  affiliation: Factions.Unaffiliated
  priority: SpawnableObjectPriority.Regular
  objectActions: []
  items: []
  savable: false

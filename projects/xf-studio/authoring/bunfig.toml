[test]
# Removes any scratch folder a test left behind once the whole run ends (tests/temp-dir.ts).
# The 20 s per-test default is the `--timeout 20000` flag (package.json "test"): Bun 1.4.4 has no bunfig key for it, and a preload's
# setDefaultTimeout reaches only the first test file of a run.
preload = ["./tests/temp-dir-sweep.ts"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XF Studio · presentation port check</title>
  <style>
    :root{font:14px system-ui;color:#edf2f1;background:#171d20}*{box-sizing:border-box}body{margin:0;padding:12px}button,input,select{font:inherit}button{cursor:pointer;background:#37464a;color:inherit;border:1px solid #718286;border-radius:3px;padding:5px 8px}button:disabled{opacity:.5;cursor:default}input,select{background:#263236;color:inherit;border:1px solid #718286;padding:4px}header,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.grid{display:grid;grid-template-columns:minmax(220px,1fr) minmax(360px,2fr) minmax(220px,1fr);gap:10px}.box{border:1px solid #65777b;padding:10px;min-width:0}#port-head-slot{height:450px}#port-uv-slot{min-height:320px}#port-head-host{height:100%;position:relative}#port-uv-host{width:100%}#port-uv-canvas{width:100%;display:block;touch-action:none;border:1px solid #718286}.row{display:flex;gap:5px;align-items:center;margin:5px 0}.row input[type=text]{min-width:0;flex:1}.list{max-height:200px;overflow:auto}pre{font:11px ui-monospace,monospace;white-space:pre-wrap;overflow:auto;max-height:230px}.muted{color:#b6c5c7}#port-status{min-height:1.5em}@media(max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header><strong>Presentation port diagnostic</strong><span class="muted">Separate browser entry · verification workspace only</span><span id="port-status">Starting…</span></header>
  <div class="tools" id="port-global-actions"></div>
  <div class="grid">
    <section class="box"><h2>Collection and layers</h2><div id="port-collection-actions"></div><div id="port-library" class="list"></div><div id="port-presets" class="list"></div><div id="port-layers" class="list"></div><div id="port-file-actions"></div></section>
    <section class="box"><h2>Head preview</h2><div id="port-head-actions"></div><div id="port-head-slot"><div id="port-head-host"></div></div><h2>UV editor</h2><div id="port-uv-actions"></div><div id="port-uv-slot"><div id="port-uv-host"><canvas id="port-uv-canvas"></canvas></div></div></section>
    <section class="box"><h2>Public state</h2><pre id="port-state"></pre><h2>Action catalogue</h2><pre id="port-actions"></pre></section>
  </div>
  <input id="port-recipe-picker" type="file" accept=".json,application/json" hidden>
  <input id="port-collection-picker" type="file" accept=".json,application/json" hidden>
  <input id="port-save-picker" type="file" accept=".dat" hidden>
  <script type="module" src="/build/port-smoke.js"></script>
</body>
</html>
